name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg test dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke Fastify production server
        run: |
          WUBLABZ_PORT=4311 npm run server >/tmp/wublabz-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4311/health >/tmp/wublabz-health.json; then
              break
            fi
            sleep 0.25
          done
          test -s /tmp/wublabz-health.json
          node -e "const fs=require('fs'); const body=JSON.parse(fs.readFileSync('/tmp/wublabz-health.json','utf8')); if (body.status !== 'ok') throw new Error('Unexpected health payload: '+JSON.stringify(body));"
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
