name: Refresh Fastify 5 Lockfile

on:
  push:
    branches:
      - launch/fastify5-release-2026-08-26
    paths:
      - .github/workflows/refresh-fastify5-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch/fastify5-release-2026-08-26
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Verify Fastify 5 resolution
        run: |
          node -e "const l=require('./package-lock.json'); const f=l.packages?.['node_modules/fastify']?.version; const w=l.packages?.['node_modules/@fastify/websocket']?.version; const c=l.packages?.['node_modules/@fastify/cors']?.version; if (!f?.startsWith('5.') || !w?.startsWith('11.') || !c?.startsWith('11.')) throw new Error(JSON.stringify({f,w,c})); console.log({fastify:f, websocket:w, cors:c});"
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m 'Resolve Fastify 5 dependency lock'
          git push origin HEAD:launch/fastify5-release-2026-08-26
