name: WubLabz Desktop Linux

on:
  push:
    branches:
      - desktop/wublabz-studio-1.0.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fakeroot

      - name: Validate
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build runtime
        run: npm run build

      - name: Build desktop UI
        run: npx vite build

      - name: Install Electron packager
        run: |
          npm install --no-save --package-lock=false electron@44.4.2
          npm install --no-save --package-lock=false electron-builder@26.0.12

      - name: Package WubLabz Studio
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --config electron-builder.yml --linux deb AppImage --publish never

      - name: List packages
        run: ls -lah release

      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: WubLabz-Studio-1.0.0-Linux-x64
          path: |
            release/*.deb
            release/*.AppImage
          if-no-files-found: error
          retention-days: 30
